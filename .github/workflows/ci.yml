name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Required by the Storybook (browser) test project.
      - run: pnpm exec playwright install --with-deps chromium

      # THE gate — defined once, in the root package.json:
      # build → lint → typecheck → check:contracts → test → verify:exports → build:storybook
      - run: pnpm validate

      # Stories-as-tests in a real browser (the axe gate). Kept out of `validate` so
      # the local gate needs no browser download; CI always runs it.
      - run: pnpm test:stories

      # The Storybook that `validate` just built doubles as the GitHub Pages
      # artifact — no second install + build in a separate workflow.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy-storybook:
    # Publish the public gallery on every push to main (or a manual run) —
    # only after the whole gate is green.
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
